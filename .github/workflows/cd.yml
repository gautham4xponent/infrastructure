name: Deployment Pipeline

on:
  push:
    branches:
      - main

jobs:
    Deployment:
        name: bundle deploy to all targets
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install Databricks CLI
              uses: databricks/setup-cli@main

            - name: Bundle validate and Deploy
              run: | 
                databricks bundle validate
                databricks bundle deploy --target dev
                databricks bundle deploy --target qa
                databricks bundle deploy --target prod
              env:                                         # SP credentials from GitHub Secrets
                DATABRICKS_AUTH_TYPE: azure-client-secret
                DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
                ARM_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
                ARM_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
                ARM_TENANT_ID: ${{ secrets.DATABRICKS_AZURE_TENANT_ID }}