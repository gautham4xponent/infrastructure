bundle:
  name: infrastructure
  uuid: 47331886-2e11-4a25-9c52-6fbd5ddc6175
  

permissions:
  - service_principal_name: platform-deployer-sp
    level: CAN_MANAGE
  - group_name: platform-engineers-group
    level: CAN_VIEW

include:
  - resources/*.yml
  - targets/*.yml

workspace:
  root_path: /Workspace/shared/.bundle/${bundle.name}/${bundle.target}

variables:
  developer_schema:
    description: "The schema where developer can experiment"
  deployer_sp:
    description: "The service principal used to deploy the bundle in the target"